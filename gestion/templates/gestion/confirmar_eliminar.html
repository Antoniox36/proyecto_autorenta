{% extends 'gestion/base.html' %}

{% block content %}
<div class="caja-confirmacion">
    <h1>Confirmar Eliminación</h1>
    <p>¿Estás seguro de que deseas eliminar {{ tipo }} <strong>"{{ objeto }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-botones">
            <button type="submit" class="btn btn-eliminar">Sí, eliminar</button>
            <a href="{% url url_cancelar %}" class="btn btn-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
